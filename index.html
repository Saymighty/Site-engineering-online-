<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Site Engineer: Master Constructor Mobile</title>
    <!-- Include Three.js for High-Performance 3D Graphics -->
    <script src="https://cloudflare.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c10; color: #fff;
            user-select: none; -webkit-user-select: none;
        }

        /* Top HUD Dashboard */
        #hud-dashboard {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(10, 10, 15, 0.95);
            padding: 10px 15px; border-radius: 8px;
            border-left: 5px solid #ffcc00;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            z-index: 10; display: flex; justify-content: space-between; align-items: center;
        }
        .hud-section { text-align: left; }
        .hud-title { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .hud-value { font-size: 16px; font-weight: bold; }
        #company-cash { color: #2ecc71; }
        #struct-integrity { color: #3498db; }
        #project-name { color: #ffcc00; font-size: 13px; font-weight: 800; }

        /* Bottom Interactive Control Panel */
        #interface-box {
            position: absolute; bottom: 15px; left: 5%; right: 5%;
            background: rgba(10, 10, 15, 0.95);
            padding: 15px; border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            z-index: 10; border: 1px solid #222;
            max-height: 50%; overflow-y: auto;
        }
        #stage-title { margin-top: 0; color: #ffcc00; font-size: 16px; font-weight: 700; text-transform: uppercase; }
        #stage-desc { font-size: 12px; color: #ccc; line-height: 1.5; margin-bottom: 10px; }
        
        /* Formula Input UI Layout */
        #input-container {
            margin: 10px 0; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .input-wrapper { display: flex; flex-direction: column; align-items: center; }
        .eng-input {
            background: #1a1a24; border: 2px solid #444; color: #fff;
            padding: 8px 10px; font-size: 14px; border-radius: 6px;
            width: 80px; text-align: center; font-weight: bold;
            outline: none; transition: border 0.3s; -webkit-appearance: none;
        }
        .eng-input:focus { border-color: #ffcc00; }
        .input-label { font-size: 11px; color: #aaa; font-weight: bold; margin-bottom: 2px; }

        .submit-btn {
            background: #ffcc00; color: #000; border: none;
            padding: 10px 20px; font-size: 13px;
            font-weight: 700; border-radius: 5px; cursor: pointer;
            transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 100%; max-width: 250px; margin-top: 5px;
        }

        /* Forensic Failure Modal Overlay */
        #failure-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(35, 10, 10, 0.98); z-index: 100;
            justify-content: center; align-items: center; flex-direction: column;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        #failure-overlay h1 { font-size: 28px; color: #e74c3c; margin-bottom: 15px; font-weight: 900; }
        #failure-overlay p { font-size: 13px; max-width: 500px; color: #fbc4c4; line-height: 1.6; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; border: 1px solid #c0392b; }
        #action-reset-btn {
            background: #fff; color: #c0392b; border: none;
            padding: 12px 25px; font-size: 14px; font-weight: bold;
            border-radius: 5px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- HUD Dashboard Panel -->
    <div id="hud-dashboard">
        <div class="hud-section">
            <div id="project-name">LOADING SITE...</div>
            <div class="hud-title">Capital</div>
            <div class="hud-value" id="company-cash">$200,000</div>
        </div>
        <div class="hud-section" style="text-align: right;">
            <div class="hud-title">Site Safety</div>
            <div class="hud-value" id="struct-integrity">100%</div>
        </div>
    </div>

    <!-- Active Formula Input Box Matrix -->
    <div id="interface-box">
        <h2 id="stage-title">Civil Engineering Hub</h2>
        <p id="stage-desc">Initializing structural configurations...</p>
        
        <div id="input-container">
            <!-- Dynamic inputs inject here -->
        </div>
        
        <button class="submit-btn" id="calc-submit-btn" onclick="verifyInputParameters()">Analyze & Cast Structure</button>
    </div>

    <!-- Engineering Forensic Collapse Panel -->
    <div id="failure-overlay">
        <h1 id="fail-title">CRITICAL STRUCTURAL FAILURE</h1>
        <p id="fail-analysis">Analyzing structural calculation matrix errors...</p>
        <button id="action-reset-btn" onclick="window.location.reload()">Clear Defects (Restart)</button>
    </div>

    <script>
        // --- CHRONOLOGICAL DATA MATRIX ---
        const ALL_PROJECTS = [
            {
                id: "bungalow",
                name: "1. Residential Bungalow",
                phases: [
                    {
                        title: "Phase 1: Setting Out (Pythagoras)",
                        desc: "Verify that your walls form a perfect 90-degree corner. Input a valid geometric sequence (e.g. 3m Base x 4m Height. Calculate the missing Hypotenuse diagonal value).",
                        inputs: [
                            { id: "param_a", label: "Base (X):", placeholder: "3" },
                            { id: "param_b", label: "Height (Y):", placeholder: "4" },
                            { id: "param_c", label: "Diagonal (Z):", placeholder: "Diagonal" }
                        ],
                        validate: function(inputs) {
                            let a = parseFloat(inputs.param_a);
                            let b = parseFloat(inputs.param_b);
                            let c = parseFloat(inputs.param_c);
                            if (Math.abs((a*a + b*b) - (c*c)) < 0.01 && c > 0) return { success: true };
                            return { success: false, text: `Geometric Structural Failure! Your inputs (${a}m x ${b}m with a ${c}m diagonal) failed the Pythagorean calculation rule. The profile lines are out-of-square, throwing off the upper wall masonry structures.` };
                        }
                    },
                    {
                        title: "Phase 2: Concrete Mix Design",
                        desc: "Specify the batching volume proportions for your concrete pour. To achieve an engineering standard structural strength classification, enter the correct ratio parameters of Cement, Sand, and Aggregates respectively.",
                        inputs: [
                            { id: "param_cement", label: "Cement:", placeholder: "1" },
                            { id: "param_sand", label: "Sand:", placeholder: "2" },
                            { id: "param_gravel", label: "Aggregate:", placeholder: "4" }
                        ],
                        validate: function(inputs) {
                            let cem = parseFloat(inputs.param_cement);
                            let snd = parseFloat(inputs.param_sand);
                            let grv = parseFloat(inputs.param_gravel);
                            if (cem === 1 && ((snd === 2 && grv === 4) || (snd === 1.5 && grv === 3))) return { success: true };
                            return { success: false, text: `Material Structural Defect! Your mix parameters (${cem}:${snd}:${grv}) failed target concrete compressive strength tests. The concrete turned porous, crumbling under structural load weight.` };
                        }
                    }
                ]
            },
            {
                id: "plaza",
                name: "2. 5-Story Commercial Plaza",
                phases: [
                    {
                        title: "Phase 1: Foundation Load Optimization",
                        desc: "Calculate the necessary pile depth coordinates required to transition loads past shifting surface silt to hit solid bedrock layer. Bedrock layer is situated exactly at a coordinate depth of 14 meters.",
                        inputs: [
                            { id: "pile_qty", label: "Piles Qty:", placeholder: "e.g. 4" },
                            { id: "pile_depth", label: "Depth (m):", placeholder: "e.g. 14" }
                        ],
                        validate: function(inputs) {
                            let qty = parseFloat(inputs.pile_qty);
                            let depth = parseFloat(inputs.pile_depth);
                            if (qty >= 4 && depth >= 14) return { success: true };
                            return { success: false, text: `Catastrophic Foundation Failure! Your pile layout configuration (${qty} piles driven to ${depth}m) failed to anchor into the solid bedrock layer at 14m. Silt shifting induced structural settlement.` };
                        }
                    }
                ]
            }
        ];

        let currentProjectIndex = 0;
        let activePhaseIndex = 0;
        let globalCapital = 200000;
        let activeProjectData = null;
        let activeStageIntegrity = 100;

        let scene, camera, renderer, runtime3DGroup;
